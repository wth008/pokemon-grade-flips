<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Watchlist · GradeFlip</title><style>
:root{color-scheme:dark;--bg:#0b0f14;--panel:#121820;--line:#27313e;--muted:#9daab9;--green:#56d6a3;--red:#ff7b86;--yellow:#f7cb6d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#edf2f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:1150px;margin:auto;padding:22px 16px 70px}.brand{font-size:11px;letter-spacing:2px;color:var(--green);font-weight:800;margin-bottom:8px}h1{font-size:27px;letter-spacing:-.8px;margin:0}.sub{color:var(--muted);font-size:13px;margin:7px 0 18px}.top{padding-bottom:18px;border-bottom:1px solid var(--line)}.filters{display:grid;grid-template-columns:1fr 1fr;gap:9px}
label.control{font-size:11px;color:var(--muted);display:flex;flex-direction:column;gap:6px}select,input,textarea{background:#10161e;color:#edf2f7;border:1px solid var(--line);border-radius:10px;padding:11px;font:inherit}select{width:100%;font-size:14px}.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px}.search{width:100%;font-size:14px}
.summary{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.summary span{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:7px;padding:7px 10px}.summary strong{color:#edf2f7}
.section{margin-top:24px}h2{font-size:18px;margin:0 0 12px}.best-tabs{display:flex;gap:8px;margin-bottom:12px}button{cursor:pointer;font:inherit}.best-tabs button{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:8px;padding:9px 12px;font-size:13px;font-weight:700}.best-tabs .on{background:#21342e;color:var(--green);border-color:#365b4d}
.bestrow{display:flex;gap:10px;overflow-x:auto;padding:2px 0 8px}.mini{min-width:215px;max-width:215px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer}.mini .nm{font-weight:750;font-size:14px}.mini .meta{margin-bottom:14px}.mini .value{font-size:25px;font-weight:800}.mini .secondary{font-size:12px;color:var(--muted);margin-top:5px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}@media(min-width:760px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.toolbar{grid-template-columns:2fr 1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}.card:hover,.mini:hover{border-color:#607288}.art{height:220px;position:relative;display:flex;justify-content:center;background:#0e141b;padding:12px}.art img{width:100%;height:100%;object-fit:contain}.yr{position:absolute;left:9px;top:9px;border:1px solid #ffffff24;background:#0b0f14db;border-radius:5px;padding:4px 6px;font-size:10px;color:#ccd6e1}.image-missing{align-items:center;color:var(--muted);font-size:12px}
.body{padding:12px;display:flex;flex-direction:column;flex:1}.name{font-size:15px;font-weight:750;line-height:1.25}.meta{color:var(--muted);font-size:11px;line-height:1.4;margin-top:5px}.badge{display:block;font-size:10px;padding:5px 7px;margin-top:8px;border-radius:5px;line-height:1.4}.warn{background:#f7cb6d12;color:var(--yellow);border:1px solid #f7cb6d30}.pending{background:#9daab910;color:var(--muted);border:1px solid var(--line)}.nums{margin-top:auto;padding-top:15px}.prices{display:grid;grid-template-columns:1fr 1fr;gap:7px;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}.prices span:last-child{text-align:right}.prices b{display:block;color:#edf2f7;font-size:16px;letter-spacing:0;margin-top:5px}.result{display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:12px;padding-top:11px;gap:5px}.metric-label{font-size:10px;color:var(--muted);margin-bottom:4px}.profit,.roi{font-size:18px;font-weight:800}.positive{color:var(--green)}.negative{color:var(--red)}.neutral{color:var(--muted)}.checked{margin-top:11px;font-size:10px;color:var(--muted);line-height:1.4}.empty{color:var(--muted);padding:24px;border:1px dashed var(--line);border-radius:12px}.yearCount{color:var(--muted);font-size:12px;font-weight:400}
.modal{position:fixed;inset:0;background:#000a;z-index:20;display:none;align-items:flex-end}.modal.show{display:flex}.sheet{max-height:95vh;overflow:auto;width:100%;max-width:560px;margin:auto auto 0;background:var(--panel);border:1px solid var(--line);border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}.sheet h3{font-size:21px;margin:0}.sm{color:var(--muted);font-size:12px;margin:6px 0 16px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:6px}.field input{width:100%;font-size:18px}.warning-field{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--yellow);margin:14px 0}.editor-status{margin-top:14px}.editor-status textarea{width:100%;resize:vertical;min-height:65px;margin-top:8px;font-size:12px}.preview{display:flex;justify-content:space-between;border:1px solid var(--line);padding:13px;border-radius:10px;margin-top:14px}.preview strong{font-size:22px}.actions{display:flex;gap:8px;margin-top:12px}.actions button{flex:1;border:1px solid var(--line);border-radius:9px;padding:12px;font-weight:700;font-size:13px}.save{background:var(--green);color:#0b2117}.cancel{background:#232d39;color:#edf2f7}.ebay{background:#142334;color:#a6ccf5}.notice{font-size:11px;line-height:1.5;color:var(--muted);margin-top:12px}.loading{color:var(--muted);padding:24px 0}

a{color:var(--green)}.nav{display:flex;gap:20px;margin-bottom:25px;font-size:13px}.nav a{text-decoration:none}.prices{grid-template-columns:repeat(3,1fr)}.prices span:last-child{text-align:left}.fields{grid-template-columns:repeat(3,1fr)}.grade-results{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;border-top:1px solid var(--line);padding-top:12px}.grade-results b{display:block;font-size:16px;margin:5px 0}.sheet label{font-size:12px}.sheet textarea{width:100%}.category-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:35px}.category{display:block;text-decoration:none;color:inherit;padding:30px;background:var(--panel);border:1px solid var(--line);border-radius:16px}.category:hover{border-color:var(--green)}.category h2{font-size:25px}.category p{color:var(--muted);line-height:1.6}.category small{color:var(--green)}@media(max-width:500px){.category-grid{grid-template-columns:1fr}.fields{grid-template-columns:1fr}.category{padding:24px}}</style></head><body><main class="wrap"><nav class="nav"><a href="/">← Home</a><a href="/sports">Sports</a><a href="/pokemon">Pokémon</a><a href="/one-piece">One Piece</a><a href="/other">Other</a></nav><div class="brand">GRADEFLIP / MARKET WATCH</div><h1 id="title">Watchlist</h1><p class="sub">Your next card market.</p><div class="empty">No cards added yet. This section is ready for your next card list.</div></main><script>document.getElementById('title').textContent=location.pathname.includes('one-piece')?'One Piece':'Other';document.title=document.getElementById('title').textContent+' · GradeFlip';</script></body></html>
